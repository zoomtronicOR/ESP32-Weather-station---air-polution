; ESP32 R201 -- Pametna meteo stanica
; Ploča: NodeMCU ESP-32S V1.1, čip ESP32-D0WD-V3 (rev 3), 4 MB flash, bez PSRAM-a

[platformio]
default_envs = esp32dev
; Lokalne tajne (OTA lozinka); folder secrets/ je u .gitignore, šablon je ota.example.ini
extra_configs = secrets/*.ini

[env:esp32dev]
; pioarduino platforma: Arduino-ESP32 3.1.3 (ESP-IDF 5.3)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32dev
framework = arduino

upload_port = COM7
upload_speed = 921600
monitor_port = COM7
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; 2 × 1,625 MB OTA aplikacija, LittleFS web 192 KB, LittleFS istorija 448 KB, coredump 64 KB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    adafruit/Adafruit BME680 Library @ ~2.0.6
    adafruit/Adafruit LTR390 Library @ ~1.1.2
    olikraus/U8g2 @ ~2.36.18
    adafruit/Adafruit SSD1306 @ ~2.5.17
    sensirion/Sensirion I2C SPS30 @ ~1.0.0
    ESP32Async/ESPAsyncWebServer @ ~3.12.1
    ESP32Async/AsyncTCP @ ~3.5.0
    bblanchon/ArduinoJson @ ~7.4.3

; Zavisnosti web servera za druge platforme (ESP8266, RP2040) nisu potrebne
lib_ignore =
    ESPAsyncTCP
    RPAsyncTCP

; Testovi na samoj ploči (pio test -f test_<senzor>)
test_framework = unity
test_port = COM7
test_speed = 115200

; Ažuriranje preko Wi-Fi-ja (ArduinoOTA): pio run -e ota -t upload  /  pio run -e ota -t uploadfs
; Adresa i administratorska lozinka uređaja su u secrets/ota.ini (vidi ota.example.ini);
; vrednosti ispod su samo podrazumevane i secrets/ota.ini ih nadjačava.
[ota_secret]
host = meteo-esp32.local
password =

[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = ${ota_secret.host}
upload_flags =
    --port=3232
    --auth=${ota_secret.password}
